<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740" role="img" aria-labelledby="ports-adapters-title ports-adapters-desc">
<title id="ports-adapters-title">HLD · Ядро, порты и адаптеры</title><desc id="ports-adapters-desc">Ядро реализует входные порты и использует выходные. Входные адаптеры вызывают сценарии, выходные реализуют контракты. Стрелки направлены к портам.</desc>
<defs><marker id="ports-adapters-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65758B"/></marker></defs>
<rect width="1180" height="740" fill="#FFFFFF"/>
<text x="590.0" y="32" text-anchor="middle" font-size="22" fill="#243247" font-family="Arial, sans-serif">HLD · Ядро, порты и адаптеры</text><text x="590.0" y="60" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">Схема зависимостей кода; контракты принадлежат приложению</text><path d="M430,220 V280 H275 V340" fill="none" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#ports-adapters-arrow)"/><rect x="234.5" y="250" width="81" height="20" fill="white"/><text x="275" y="265" text-anchor="middle" font-size="13" fill="#243247" font-family="Arial, sans-serif">Реализует</text><path d="M690,220 V280 H905 V340" fill="none" stroke="#65758B" marker-end="url(#ports-adapters-arrow)"/><rect x="861.0" y="250" width="88" height="20" fill="white"/><text x="905" y="265" text-anchor="middle" font-size="13" fill="#243247" font-family="Arial, sans-serif">Использует</text><path d="M275,520 V440" fill="none" stroke="#65758B" marker-end="url(#ports-adapters-arrow)"/><rect x="238.0" y="475" width="74" height="20" fill="white"/><text x="275" y="490" text-anchor="middle" font-size="13" fill="#243247" font-family="Arial, sans-serif">Вызывает</text><path d="M905,520 V440" fill="none" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#ports-adapters-arrow)"/><rect x="864.5" y="475" width="81" height="20" fill="white"/><text x="905" y="490" text-anchor="middle" font-size="13" fill="#243247" font-family="Arial, sans-serif">Реализует</text><rect x="330" y="100" width="460" height="120" rx="6" fill="#EEF3FB" stroke="#2E5AA8"/><text x="560.0" y="124" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Ядро приложения</text><text x="560.0" y="143" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Правила готовности / совместимости</text><text x="560.0" y="162" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Сценарии обработки и публикации</text><text x="560.0" y="181" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Политика режимов / ожидания</text><rect x="50" y="340" width="450" height="100" rx="6" fill="white" stroke="#C9D3DF"/><text x="275.0" y="364" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Входные порты</text><text x="275.0" y="383" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Запуск / продолжение / повтор / поиск</text><rect x="680" y="340" width="450" height="100" rx="6" fill="white" stroke="#C9D3DF"/><text x="905.0" y="364" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Выходные порты</text><text x="905.0" y="383" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Задания / результаты / каталог</text><text x="905.0" y="402" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">ML / процессы / наблюдения / время</text><rect x="50" y="520" width="450" height="80" rx="6" fill="white" stroke="#C9D3DF"/><text x="275.0" y="544" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Входные адаптеры</text><text x="275.0" y="563" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Web / локальная команда / тест</text><rect x="680" y="520" width="450" height="100" rx="6" fill="white" stroke="#C9D3DF"/><text x="905.0" y="544" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Выходные адаптеры</text><text x="905.0" y="563" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">PostgreSQL / файлы / HTTP I / модели</text><text x="905.0" y="582" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">ОС / ресурсный монитор / часы</text><text x="590.0" y="720" text-anchor="middle" font-size="11" fill="#65758B" font-family="Arial, sans-serif">Стрелки — зависимости от контрактов, не порядок обработки. Пунктир — реализация порта.</text></svg>