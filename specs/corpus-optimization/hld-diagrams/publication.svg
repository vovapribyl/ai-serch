<svg xmlns="http://www.w3.org/2000/svg" width="800" height="896" viewBox="0 0 800 896" role="img" aria-labelledby="publication-title publication-desc">
<title id="publication-title">HLD · Публикация через снимок каталога</title><desc id="publication-desc">Контроллер проверяет готовность и файлы, подготавливает snapshot состава и транзакционно переключает active pointer. Поиск закрепляет snapshot для всего запроса.</desc>
<defs><marker id="publication-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65758B"/></marker></defs>
<rect width="800" height="896" fill="#FFFFFF"/>
<text x="400.0" y="32" text-anchor="middle" font-size="22" fill="#243247" font-family="Arial, sans-serif">HLD · Публикация через снимок каталога</text><text x="400.0" y="60" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">Готовая редакция товара; операция внутри допустимого запуска</text><line x1="100" y1="132" x2="100" y2="824" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="300" y1="132" x2="300" y2="824" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="500" y1="132" x2="500" y2="824" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="700" y1="132" x2="700" y2="824" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="100" y1="184" x2="300" y2="184" stroke="#65758B" marker-end="url(#publication-arrow)"/><rect x="110.8" y="132" width="178.4" height="44" fill="white"/><text x="200.0" y="148" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Проверить полные</text><text x="200.0" y="166" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">совместимые результаты</text><line x1="300" y1="248" x2="100" y2="248" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#publication-arrow)"/><rect x="110.8" y="214" width="178.4" height="26" fill="white"/><text x="200.0" y="230" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Проверенные результаты</text><line x1="100" y1="312" x2="500" y2="312" stroke="#65758B" marker-end="url(#publication-arrow)"/><rect x="142.4" y="278" width="315.2" height="26" fill="white"/><text x="300.0" y="294" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Проверить готовность всей редакции товара</text><line x1="500" y1="376" x2="100" y2="376" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#publication-arrow)"/><rect x="174.8" y="342" width="250.4" height="26" fill="white"/><text x="300.0" y="358" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Все фото завершены; есть готовое</text><line x1="100" y1="440" x2="500" y2="440" stroke="#65758B" marker-end="url(#publication-arrow)"/><rect x="156.79999999999998" y="406" width="286.40000000000003" height="26" fill="white"/><text x="300.0" y="422" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Подготовить редакцию и снимок состава</text><line x1="500" y1="504" x2="100" y2="504" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#publication-arrow)"/><rect x="207.2" y="470" width="185.6" height="26" fill="white"/><text x="300.0" y="486" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Неактивный снимок готов</text><line x1="100" y1="568" x2="500" y2="568" stroke="#65758B" marker-end="url(#publication-arrow)"/><rect x="131.6" y="516" width="336.8" height="44" fill="white"/><text x="300.0" y="532" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Транзакция: проверить владельца и указатель;</text><text x="300.0" y="550" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">активировать и записать публикацию</text><line x1="500" y1="632" x2="100" y2="632" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#publication-arrow)"/><rect x="225.2" y="598" width="149.6" height="26" fill="white"/><text x="300.0" y="614" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Commit подтверждён</text><line x1="700" y1="696" x2="500" y2="696" stroke="#65758B" marker-end="url(#publication-arrow)"/><rect x="500.0" y="644" width="200.0" height="44" fill="white"/><text x="600.0" y="660" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">После допуска SEARCH</text><text x="600.0" y="678" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">закрепить активный снимок</text><line x1="500" y1="760" x2="700" y2="760" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#publication-arrow)"/><rect x="514.4" y="708" width="171.20000000000002" height="44" fill="white"/><text x="600.0" y="724" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Один снимок для всего</text><text x="600.0" y="742" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">запроса</text><rect x="12" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="100" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Контроллер</text><rect x="212" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="300" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Файлы</text><text x="300" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">результатов</text><rect x="412" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="500" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">PostgreSQL</text><text x="500" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Состояние / каталог</text><rect x="612" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="700" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Чтение</text><text x="700" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">для поиска</text><text x="400.0" y="856" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">До commit прежний каталог активен; повтор редакции не создаёт дубликат.</text><text x="400.0" y="878" text-anchor="middle" font-size="12" fill="#65758B" font-family="Arial, sans-serif">Сплошная стрелка — вызов; пунктирная — ответ. Время идёт сверху вниз.</text></svg>