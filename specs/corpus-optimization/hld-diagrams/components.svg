<svg xmlns="http://www.w3.org/2000/svg" width="800" height="805" viewBox="0 0 800 805" role="img" aria-labelledby="components-title components-desc">
<title id="components-title">HLD · Компоненты пополнения</title><desc id="components-desc">Лёгкое приложение и управление режимами запускают отдельные исполнители поиска и пополнения. PostgreSQL хранит очередь, прогресс и каталог; частные файлы хранят результаты.</desc>
<defs><marker id="components-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65758B"/></marker></defs>
<rect width="800" height="805" fill="#FFFFFF"/>
<text x="400.0" y="32" text-anchor="middle" font-size="22" fill="#243247" font-family="Arial, sans-serif">HLD · Компоненты пополнения</text><text x="400.0" y="60" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">Один Mac; ML-поиск и build выполняются по очереди</text><rect x="30" y="170" width="740" height="590" rx="10" fill="#FAFBFD" stroke="#C9D3DF"/><path d="M400,140 V190" fill="none" stroke="#65758B" marker-end="url(#components-arrow)"/><rect x="370.0" y="155" width="60" height="20" fill="white"/><text x="400" y="170" text-anchor="middle" font-size="13" fill="#243247" font-family="Arial, sans-serif">Запрос</text><path d="M400,250 V300" fill="none" stroke="#65758B" marker-end="url(#components-arrow)"/><rect x="370.0" y="265" width="60" height="20" fill="white"/><text x="400" y="280" text-anchor="middle" font-size="13" fill="#243247" font-family="Arial, sans-serif">Допуск</text><path d="M400,360 V400 H195 V450" fill="none" stroke="#65758B" marker-end="url(#components-arrow)"/><rect x="124.0" y="373" width="102" height="20" fill="white"/><text x="175" y="388" text-anchor="middle" font-size="13" fill="#243247" font-family="Arial, sans-serif">Режим SEARCH</text><path d="M400,360 V400 H605 V450" fill="none" stroke="#65758B" marker-end="url(#components-arrow)"/><rect x="572.5" y="373" width="95" height="20" fill="white"/><text x="620" y="388" text-anchor="middle" font-size="13" fill="#243247" font-family="Arial, sans-serif">Режим BUILD</text><path d="M195,530 V650" fill="none" stroke="#65758B" marker-end="url(#components-arrow)"/><rect x="133.5" y="590" width="123" height="20" fill="white"/><text x="195" y="605" text-anchor="middle" font-size="13" fill="#243247" font-family="Arial, sans-serif">Чтение каталога</text><path d="M605,530 V650" fill="none" stroke="#65758B" marker-end="url(#components-arrow)"/><rect x="536.5" y="590" width="137" height="20" fill="white"/><text x="605" y="605" text-anchor="middle" font-size="13" fill="#243247" font-family="Arial, sans-serif">Запись / проверка</text><path d="M480,490 H430 V690 H320" fill="none" stroke="#65758B" marker-end="url(#components-arrow)"/><rect x="310.5" y="555" width="165" height="20" fill="white"/><text x="393" y="570" text-anchor="middle" font-size="13" fill="#243247" font-family="Arial, sans-serif">Прогресс / публикация</text><rect x="280" y="80" width="240" height="60" rx="6" fill="white" stroke="#C9D3DF"/><text x="400.0" y="104" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Владелец / пользователь</text><text x="400.0" y="123" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Команды и поиск</text><rect x="280" y="190" width="240" height="60" rx="6" fill="white" stroke="#C9D3DF"/><text x="400.0" y="214" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Web / локальная команда</text><text x="400.0" y="233" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Без ML-моделей</text><rect x="280" y="300" width="240" height="60" rx="6" fill="#EEF3FB" stroke="#2E5AA8"/><text x="400.0" y="324" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Управление режимами</text><text x="400.0" y="343" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Допуск и свои процессы</text><rect x="70" y="450" width="250" height="80" rx="6" fill="white" stroke="#C9D3DF"/><text x="195.0" y="474" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Исполнитель поиска</text><text x="195.0" y="493" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Собственные ML-процессы</text><text x="195.0" y="512" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Фиксированный снимок</text><rect x="480" y="450" width="250" height="80" rx="6" fill="white" stroke="#C9D3DF"/><text x="605.0" y="474" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Контроллер пополнения</text><text x="605.0" y="493" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">I и encoder по очереди</text><text x="605.0" y="512" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">До 5 фото на запуск</text><rect x="70" y="650" width="250" height="80" rx="6" fill="white" stroke="#C9D3DF"/><text x="195.0" y="674" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">PostgreSQL / pgvector</text><text x="195.0" y="693" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Задания и прогресс</text><text x="195.0" y="712" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Редакции / снимки</text><rect x="480" y="650" width="250" height="80" rx="6" fill="white" stroke="#C9D3DF"/><text x="605.0" y="674" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Частные файлы</text><text x="605.0" y="693" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Фото / маски / crops</text><text x="605.0" y="712" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Результаты стадий</text><text x="400.0" y="785" text-anchor="middle" font-size="11" fill="#65758B" font-family="Arial, sans-serif">Показаны основные связи. I/backend и модели — в утверждённой sequence TO-BE.</text></svg>