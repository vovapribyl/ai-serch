<svg xmlns="http://www.w3.org/2000/svg" width="800" height="768" viewBox="0 0 800 768" role="img" aria-labelledby="to-be-publication-title to-be-publication-desc">
<title id="to-be-publication-title">TO-BE · Автоматическая публикация товара</title><desc id="to-be-publication-desc">Управляющий процесс проверяет состояние и файлы товара, готовит неактивную редакцию и атомарно публикует её без ручного подтверждения.</desc>
<defs><marker id="to-be-publication-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65758B"/></marker></defs>
<rect width="800" height="768" fill="#FFFFFF"/>
<text x="400.0" y="32" text-anchor="middle" font-size="22" fill="#243247" font-family="Arial, sans-serif">TO-BE · Автоматическая публикация товара</text><text x="400.0" y="60" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">Все выбранные фото завершены; хотя бы одно полностью готово</text><line x1="100" y1="132" x2="100" y2="696" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="300" y1="132" x2="300" y2="696" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="500" y1="132" x2="500" y2="696" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="700" y1="132" x2="700" y2="696" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="100" y1="184" x2="300" y2="184" stroke="#65758B" marker-end="url(#to-be-publication-arrow)"/><rect x="107.2" y="132" width="185.6" height="44" fill="white"/><text x="200.0" y="148" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Проверить все выбранные</text><text x="200.0" y="166" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">фото товара</text><line x1="300" y1="248" x2="100" y2="248" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#to-be-publication-arrow)"/><rect x="121.6" y="196" width="156.8" height="44" fill="white"/><text x="200.0" y="212" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Все завершены; есть</text><text x="200.0" y="230" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">готовое фото</text><line x1="100" y1="312" x2="500" y2="312" stroke="#65758B" marker-end="url(#to-be-publication-arrow)"/><rect x="113.6" y="278" width="372.8" height="26" fill="white"/><text x="300.0" y="294" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Проверить целостность и совместимость результатов</text><line x1="500" y1="376" x2="100" y2="376" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#to-be-publication-arrow)"/><rect x="203.6" y="342" width="192.8" height="26" fill="white"/><text x="300.0" y="358" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Проверенные готовые фото</text><line x1="100" y1="440" x2="700" y2="440" stroke="#65758B" marker-end="url(#to-be-publication-arrow)"/><rect x="253.2" y="406" width="293.6" height="26" fill="white"/><text x="400.0" y="422" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Подготовить неактивную редакцию товара</text><line x1="700" y1="504" x2="100" y2="504" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#to-be-publication-arrow)"/><rect x="325.2" y="470" width="149.6" height="26" fill="white"/><text x="400.0" y="486" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Редакция проверена</text><line x1="100" y1="568" x2="700" y2="568" stroke="#65758B" marker-end="url(#to-be-publication-arrow)"/><rect x="217.2" y="534" width="365.6" height="26" fill="white"/><text x="400.0" y="550" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Атомарно опубликовать и записать редакцию товара</text><line x1="700" y1="632" x2="100" y2="632" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#to-be-publication-arrow)"/><rect x="285.6" y="598" width="228.8" height="26" fill="white"/><text x="400.0" y="614" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Commit: товар доступен поиску</text><rect x="12" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="100" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Управляющий</text><text x="100" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">процесс</text><rect x="212" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="300" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Задания</text><text x="300" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">и прогресс</text><rect x="412" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="500" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Файлы</text><text x="500" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">результатов</text><rect x="612" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="700" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Поисковый</text><text x="700" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">каталог</text><text x="400.0" y="728" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">Без ручного подтверждения; сбой до commit сохраняет прежний каталог.</text><text x="400.0" y="750" text-anchor="middle" font-size="12" fill="#65758B" font-family="Arial, sans-serif">Сплошная стрелка — вызов; пунктирная — ответ. Время идёт сверху вниз.</text></svg>