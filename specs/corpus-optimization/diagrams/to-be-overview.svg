<svg xmlns="http://www.w3.org/2000/svg" width="800" height="772" viewBox="0 0 800 772" role="img" aria-labelledby="to-be-overview-title to-be-overview-desc">
<title id="to-be-overview-title">TO-BE · Стадии небольшой партии</title><desc id="to-be-overview-desc">Партия до 5 фото, checkpoints по стадиям, автоматическая публикация готовых товаров; поиск и build по очереди.</desc>
<defs><marker id="to-be-overview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65758B"/></marker></defs>
<rect width="800" height="772" fill="#FFFFFF"/>
<text x="400.0" y="32" text-anchor="middle" font-size="22" fill="#243247" font-family="Arial, sans-serif">TO-BE · Стадии небольшой партии</text><text x="400.0" y="60" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">До 5 фото на запуск; поиск и build работают по очереди</text><line x1="400" y1="144" x2="400" y2="172" stroke="#65758B" marker-end="url(#to-be-overview-arrow)"/><line x1="400" y1="236" x2="400" y2="264" stroke="#65758B" marker-end="url(#to-be-overview-arrow)"/><line x1="400" y1="328" x2="400" y2="356" stroke="#65758B" marker-end="url(#to-be-overview-arrow)"/><line x1="400" y1="420" x2="400" y2="448" stroke="#65758B" marker-end="url(#to-be-overview-arrow)"/><line x1="400" y1="512" x2="400" y2="540" stroke="#65758B" marker-end="url(#to-be-overview-arrow)"/><line x1="400" y1="604" x2="400" y2="632" stroke="#65758B" marker-end="url(#to-be-overview-arrow)"/><rect x="160" y="88" width="480" height="56" rx="6" fill="#FFFFFF" stroke="#C9D3DF"/><text x="400" y="112" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Приостановить поиск; освободить ML-ресурсы</text><text x="400" y="132" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Выбрать из очереди до 5 фото</text><rect x="160" y="180" width="480" height="56" rx="6" fill="#EEF3FB" stroke="#2E5AA8"/><text x="400" y="204" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">I: вернуть области и маски</text><text x="400" y="224" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Backend: создать crops и сохранить checkpoint</text><rect x="160" y="272" width="480" height="56" rx="6" fill="#FFFFFF" stroke="#C9D3DF"/><text x="400" y="296" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Завершить свой локализатор</text><text x="400" y="316" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Подтвердить выход процесса</text><rect x="160" y="364" width="480" height="56" rx="6" fill="#FFFFFF" stroke="#C9D3DF"/><text x="400" y="388" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Для каждой модели: OpenCLIP → DINOv2 → SigLIP2</text><text x="400" y="408" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Загрузить → векторы → сохранить → завершить worker</text><rect x="160" y="456" width="480" height="56" rx="6" fill="#FFFFFF" stroke="#C9D3DF"/><text x="400" y="480" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Проверить весь список фото каждого товара</text><text x="400" y="500" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Все завершены; хотя бы одно готово</text><rect x="160" y="548" width="480" height="56" rx="6" fill="#FFFFFF" stroke="#C9D3DF"/><text x="400" y="572" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Автоматически публиковать готовые товары</text><text x="400" y="592" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Атомарно; ошибки фото сохранены</text><rect x="160" y="640" width="480" height="56" rx="6" fill="#FFFFFF" stroke="#C9D3DF"/><text x="400" y="664" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Завершить запуск; вернуть поиск</text><text x="400" y="684" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Следующая партия — новый пакет запуска</text><text x="400" y="752" text-anchor="middle" font-size="12" fill="#65758B" font-family="Arial, sans-serif">Одна тяжёлая стадия за раз; выгода по памяти ещё требует измерения.</text></svg>