<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1056" viewBox="0 0 1200 1056" role="img" aria-labelledby="as-is-sequence-title as-is-sequence-desc">
<title id="as-is-sequence-title">AS-IS · Успешная обработка одного фото</title><desc id="as-is-sequence-desc">Backend NailImageProcessor вызывает I, получает области и маски и создаёт crops; затем сборщик вычисляет векторы и сохраняет полный результат.</desc>
<defs><marker id="as-is-sequence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65758B"/></marker></defs>
<rect width="1200" height="1056" fill="#FFFFFF"/>
<text x="600.0" y="32" text-anchor="middle" font-size="22" fill="#243247" font-family="Arial, sans-serif">AS-IS · Успешная обработка одного фото</text><text x="600.0" y="60" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">Для остальных PENDING фото последовательность повторяется</text><line x1="100" y1="132" x2="100" y2="984" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="300" y1="132" x2="300" y2="984" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="500" y1="132" x2="500" y2="984" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="700" y1="132" x2="700" y2="984" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="900" y1="132" x2="900" y2="984" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="1100" y1="132" x2="1100" y2="984" stroke="#C9D3DF" stroke-dasharray="5 5"/><rect x="288" y="584" width="624" height="168" fill="none" stroke="#C9D3DF"/><rect x="296" y="574" width="608" height="22" fill="white"/><text x="304" y="590" text-anchor="start" font-size="12" fill="#2E5AA8" font-family="Arial, sans-serif">Повтор: OpenCLIP → DINOv2 → SigLIP2</text><line x1="100" y1="184" x2="300" y2="184" stroke="#65758B" marker-end="url(#as-is-sequence-arrow)"/><rect x="110.8" y="132" width="178.4" height="44" fill="white"/><text x="200.0" y="148" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Разрешить ограниченный</text><text x="200.0" y="166" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">проход</text><line x1="300" y1="248" x2="1100" y2="248" stroke="#65758B" marker-end="url(#as-is-sequence-arrow)"/><rect x="564.0" y="214" width="272.0" height="26" fill="white"/><text x="700.0" y="230" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Прочитать состояние выбранного фото</text><line x1="1100" y1="312" x2="300" y2="312" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#as-is-sequence-arrow)"/><rect x="607.2" y="278" width="185.6" height="26" fill="white"/><text x="700.0" y="294" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">PENDING фото и его вход</text><line x1="300" y1="376" x2="500" y2="376" stroke="#65758B" marker-end="url(#as-is-sequence-arrow)"/><rect x="332.4" y="342" width="135.2" height="26" fill="white"/><text x="400.0" y="358" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Подготовить фото</text><line x1="500" y1="440" x2="700" y2="440" stroke="#65758B" marker-end="url(#as-is-sequence-arrow)"/><rect x="507.2" y="406" width="185.6" height="26" fill="white"/><text x="600.0" y="422" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Выделить области ногтей</text><line x1="700" y1="504" x2="500" y2="504" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#as-is-sequence-arrow)"/><rect x="536.0" y="470" width="128.0" height="26" fill="white"/><text x="600.0" y="486" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Области и маски</text><line x1="500" y1="568" x2="300" y2="568" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#as-is-sequence-arrow)"/><rect x="300.0" y="516" width="200.0" height="44" fill="white"/><text x="400.0" y="532" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Готовые crops из исходных</text><text x="400.0" y="550" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">пикселей</text><line x1="300" y1="664" x2="900" y2="664" stroke="#65758B" marker-end="url(#as-is-sequence-arrow)"/><rect x="471.2" y="630" width="257.6" height="26" fill="white"/><text x="600.0" y="646" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Вычислить векторы всех crops фото</text><line x1="900" y1="728" x2="300" y2="728" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#as-is-sequence-arrow)"/><rect x="503.6" y="694" width="192.8" height="26" fill="white"/><text x="600.0" y="710" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Vectors выбранной модели</text><line x1="300" y1="792" x2="1100" y2="792" stroke="#65758B" marker-end="url(#as-is-sequence-arrow)"/><rect x="513.6" y="758" width="372.8" height="26" fill="white"/><text x="700.0" y="774" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Сохранить маски / crops и все три набора векторов</text><line x1="1100" y1="856" x2="300" y2="856" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#as-is-sequence-arrow)"/><rect x="592.8" y="822" width="214.4" height="26" fill="white"/><text x="700.0" y="838" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Полный исход фото закреплён</text><line x1="300" y1="920" x2="100" y2="920" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#as-is-sequence-arrow)"/><rect x="107.2" y="868" width="185.6" height="44" fill="white"/><text x="200.0" y="884" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">В конце прохода вернуть</text><text x="200.0" y="902" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">сводку</text><rect x="12" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="100" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Владелец</text><rect x="212" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="300" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Сборщик</text><rect x="412" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="500" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Подготовка crops</text><text x="500" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">NailImageProcessor</text><rect x="612" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="700" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Локализатор I</text><rect x="812" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="900" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Вычислитель</text><text x="900" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">векторов</text><rect x="1012" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="1100" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Хранилище</text><text x="600.0" y="1016" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">Загруженные модели остаются в памяти. Публикация выполняется отдельно.</text><text x="600.0" y="1038" text-anchor="middle" font-size="12" fill="#65758B" font-family="Arial, sans-serif">Сплошная стрелка — вызов; пунктирная — ответ. Время идёт сверху вниз.</text></svg>