<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1440" viewBox="0 0 1400 1440" role="img" aria-labelledby="to-be-sequence-title to-be-sequence-desc">
<title id="to-be-sequence-title">TO-BE · Успешная партия</title><desc id="to-be-sequence-desc">I возвращает области и маски. Backend создаёт и сохраняет crops с checkpoints; после завершения I поочерёдно работают encoder workers.</desc>
<defs><marker id="to-be-sequence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65758B"/></marker></defs>
<rect width="1400" height="1440" fill="#FFFFFF"/>
<text x="700.0" y="32" text-anchor="middle" font-size="22" fill="#243247" font-family="Arial, sans-serif">TO-BE · Успешная партия</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">Успешная партия до 5 фото; публикация показана отдельно</text><line x1="100" y1="132" x2="100" y2="1368" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="300" y1="132" x2="300" y2="1368" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="500" y1="132" x2="500" y2="1368" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="700" y1="132" x2="700" y2="1368" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="900" y1="132" x2="900" y2="1368" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="1100" y1="132" x2="1100" y2="1368" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="1300" y1="132" x2="1300" y2="1368" stroke="#C9D3DF" stroke-dasharray="5 5"/><rect x="288" y="776" width="1024" height="360" fill="none" stroke="#C9D3DF"/><rect x="296" y="766" width="1008" height="22" fill="white"/><text x="304" y="782" text-anchor="start" font-size="12" fill="#2E5AA8" font-family="Arial, sans-serif">Повтор: OpenCLIP → DINOv2 → SigLIP2</text><line x1="100" y1="184" x2="300" y2="184" stroke="#65758B" marker-end="url(#to-be-sequence-arrow)"/><rect x="110.8" y="132" width="178.4" height="44" fill="white"/><text x="200.0" y="148" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Разрешить ограниченный</text><text x="200.0" y="166" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">запуск</text><line x1="300" y1="248" x2="1300" y2="248" stroke="#65758B" marker-end="url(#to-be-sequence-arrow)"/><rect x="689.2" y="214" width="221.6" height="26" fill="white"/><text x="800.0" y="230" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Выбрать до 5 фото из очереди</text><line x1="1300" y1="312" x2="300" y2="312" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#to-be-sequence-arrow)"/><rect x="714.4" y="278" width="171.20000000000002" height="26" fill="white"/><text x="800.0" y="294" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Фото и профиль партии</text><line x1="300" y1="376" x2="500" y2="376" stroke="#65758B" marker-end="url(#to-be-sequence-arrow)"/><rect x="321.6" y="324" width="156.8" height="44" fill="white"/><text x="400.0" y="340" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Подготовить фото по</text><text x="400.0" y="358" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">одному</text><line x1="500" y1="440" x2="700" y2="440" stroke="#65758B" marker-end="url(#to-be-sequence-arrow)"/><rect x="507.2" y="406" width="185.6" height="26" fill="white"/><text x="600.0" y="422" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Выделить области ногтей</text><line x1="700" y1="504" x2="500" y2="504" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#to-be-sequence-arrow)"/><rect x="536.0" y="470" width="128.0" height="26" fill="white"/><text x="600.0" y="486" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Области и маски</text><line x1="500" y1="568" x2="1100" y2="568" stroke="#65758B" marker-end="url(#to-be-sequence-arrow)"/><rect x="667.6" y="534" width="264.8" height="26" fill="white"/><text x="800.0" y="550" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Записать и проверить masks / crops</text><line x1="500" y1="632" x2="1300" y2="632" stroke="#65758B" marker-end="url(#to-be-sequence-arrow)"/><rect x="746.0" y="598" width="308.0" height="26" fill="white"/><text x="900.0" y="614" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Закрепить checkpoint после записи файлов</text><line x1="500" y1="696" x2="300" y2="696" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#to-be-sequence-arrow)"/><rect x="332.4" y="662" width="135.2" height="26" fill="white"/><text x="400.0" y="678" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Стадия сохранена</text><line x1="300" y1="760" x2="700" y2="760" stroke="#65758B" marker-end="url(#to-be-sequence-arrow)"/><rect x="349.6" y="726" width="300.8" height="26" fill="white"/><text x="500.0" y="742" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Завершить свой процесс; проверить выход</text><line x1="300" y1="856" x2="900" y2="856" stroke="#65758B" marker-end="url(#to-be-sequence-arrow)"/><rect x="489.2" y="822" width="221.6" height="26" fill="white"/><text x="600.0" y="838" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Обработать сохранённые crops</text><line x1="900" y1="920" x2="1100" y2="920" stroke="#65758B" marker-end="url(#to-be-sequence-arrow)"/><rect x="918.0" y="868" width="164.0" height="44" fill="white"/><text x="1000.0" y="884" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Записать и проверить</text><text x="1000.0" y="902" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">vectors</text><line x1="900" y1="984" x2="1300" y2="984" stroke="#65758B" marker-end="url(#to-be-sequence-arrow)"/><rect x="967.6" y="950" width="264.8" height="26" fill="white"/><text x="1100.0" y="966" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Закрепить checkpoint фото / модели</text><line x1="900" y1="1048" x2="300" y2="1048" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#to-be-sequence-arrow)"/><rect x="492.8" y="1014" width="214.4" height="26" fill="white"/><text x="600.0" y="1030" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Результаты стадии сохранены</text><line x1="300" y1="1112" x2="900" y2="1112" stroke="#65758B" marker-end="url(#to-be-sequence-arrow)"/><rect x="471.2" y="1078" width="257.6" height="26" fill="white"/><text x="600.0" y="1094" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Завершить worker; проверить выход</text><line x1="300" y1="1176" x2="1300" y2="1176" stroke="#65758B" marker-end="url(#to-be-sequence-arrow)"/><rect x="606.4" y="1142" width="387.2" height="26" fill="white"/><text x="800.0" y="1158" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Проверить готовность товаров по всем выбранным фото</text><line x1="1300" y1="1240" x2="300" y2="1240" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#to-be-sequence-arrow)"/><rect x="656.8" y="1206" width="286.40000000000003" height="26" fill="white"/><text x="800.0" y="1222" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Готовые товары либо оставшаяся работа</text><line x1="300" y1="1304" x2="100" y2="1304" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#to-be-sequence-arrow)"/><rect x="107.2" y="1252" width="185.6" height="44" fill="white"/><text x="200.0" y="1268" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">После публикации и</text><text x="200.0" y="1286" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">teardown вернуть сводку</text><rect x="12" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="100" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Владелец</text><rect x="212" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="300" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Управляющий</text><text x="300" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">процесс</text><rect x="412" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="500" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Подготовка crops</text><text x="500" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">в backend</text><rect x="612" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="700" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Локализатор I</text><rect x="812" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="900" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Вычислитель</text><text x="900" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">векторов</text><rect x="1012" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="1100" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Файлы</text><text x="1100" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">результатов</text><rect x="1212" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="1300" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Задания</text><text x="1300" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">и прогресс</text><text x="700.0" y="1400" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">Сначала проверенные файлы, затем commit checkpoint; поиск приостановлен.</text><text x="700.0" y="1422" text-anchor="middle" font-size="12" fill="#65758B" font-family="Arial, sans-serif">Сплошная стрелка — вызов; пунктирная — ответ. Время идёт сверху вниз.</text></svg>