<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" role="img" aria-labelledby="to-be-resume-title to-be-resume-desc">
<title id="to-be-resume-title">TO-BE · Остановка и продолжение</title><desc id="to-be-resume-desc">Контроль ресурсов останавливает работу; завершённые checkpoints сохраняются. После отдельного разрешения проверяется их совместимость и обрабатывается незавершённая часть.</desc>
<defs><marker id="to-be-resume-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65758B"/></marker></defs>
<rect width="1000" height="960" fill="#FFFFFF"/>
<text x="500.0" y="32" text-anchor="middle" font-size="22" fill="#243247" font-family="Arial, sans-serif">TO-BE · Остановка и продолжение</text><text x="500.0" y="60" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">Пример: crops и OpenCLIP готовы; остановка во время DINOv2</text><line x1="100" y1="132" x2="100" y2="888" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="300" y1="132" x2="300" y2="888" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="500" y1="132" x2="500" y2="888" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="700" y1="132" x2="700" y2="888" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="900" y1="132" x2="900" y2="888" stroke="#C9D3DF" stroke-dasharray="5 5"/><line x1="300" y1="184" x2="500" y2="184" stroke="#65758B" marker-end="url(#to-be-resume-arrow)"/><rect x="307.2" y="150" width="185.6" height="26" fill="white"/><text x="400.0" y="166" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Запустить стадию DINOv2</text><line x1="500" y1="248" x2="700" y2="248" stroke="#65758B" marker-end="url(#to-be-resume-arrow)"/><rect x="507.2" y="196" width="185.6" height="44" fill="white"/><text x="600.0" y="212" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Закреплять checkpoints</text><text x="600.0" y="230" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">завершённых стадий фото</text><line x1="900" y1="312" x2="300" y2="312" stroke="#65758B" marker-end="url(#to-be-resume-arrow)"/><rect x="352.4" y="278" width="495.2" height="26" fill="white"/><text x="600.0" y="294" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Критическое давление / неизвестное или устаревшее наблюдение: STOP</text><line x1="300" y1="376" x2="500" y2="376" stroke="#65758B" marker-end="url(#to-be-resume-arrow)"/><rect x="300.0" y="324" width="200.0" height="44" fill="white"/><text x="400.0" y="340" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Остановить свои процессы;</text><text x="400.0" y="358" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">проверить выход</text><line x1="300" y1="440" x2="700" y2="440" stroke="#65758B" marker-end="url(#to-be-resume-arrow)"/><rect x="338.79999999999995" y="406" width="322.40000000000003" height="26" fill="white"/><text x="500.0" y="422" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Зафиксировать STOP; публикацию не начинать</text><line x1="100" y1="504" x2="300" y2="504" stroke="#65758B" marker-end="url(#to-be-resume-arrow)"/><rect x="125.2" y="452" width="149.6" height="44" fill="white"/><text x="200.0" y="468" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Отдельно разрешить</text><text x="200.0" y="486" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">продолжение</text><line x1="300" y1="568" x2="700" y2="568" stroke="#65758B" marker-end="url(#to-be-resume-arrow)"/><rect x="360.4" y="534" width="279.2" height="26" fill="white"/><text x="500.0" y="550" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Проверить SHA, профиль и checkpoints</text><line x1="700" y1="632" x2="300" y2="632" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#to-be-resume-arrow)"/><rect x="367.6" y="598" width="264.8" height="26" fill="white"/><text x="500.0" y="614" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Готовые и незавершённые результаты</text><line x1="300" y1="696" x2="500" y2="696" stroke="#65758B" marker-end="url(#to-be-resume-arrow)"/><rect x="321.6" y="644" width="156.8" height="44" fill="white"/><text x="400.0" y="660" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Выполнить только</text><text x="400.0" y="678" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">незавершённую часть</text><line x1="500" y1="760" x2="700" y2="760" stroke="#65758B" marker-end="url(#to-be-resume-arrow)"/><rect x="514.4" y="708" width="171.20000000000002" height="44" fill="white"/><text x="600.0" y="724" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Закрепить завершённые</text><text x="600.0" y="742" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">результаты</text><line x1="500" y1="824" x2="300" y2="824" stroke="#65758B" stroke-dasharray="6 4" marker-end="url(#to-be-resume-arrow)"/><rect x="307.2" y="772" width="185.6" height="44" fill="white"/><text x="400.0" y="788" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Стадия завершена; затем</text><text x="400.0" y="806" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">SigLIP2</text><rect x="12" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="100" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Владелец</text><rect x="212" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="300" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Управляющий</text><text x="300" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">процесс</text><rect x="412" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="500" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Worker DINOv2</text><rect x="612" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="700" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Задания</text><text x="700" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">и прогресс</text><rect x="812" y="88" width="176" height="44" rx="6" fill="white" stroke="#C9D3DF"/><text x="900" y="108" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">Контроль</text><text x="900" y="124" text-anchor="middle" font-size="16" fill="#243247" font-family="Arial, sans-serif">ресурсов</text><text x="500.0" y="920" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">Hard STOP: новое разрешение и пакет; ошибки фото повторяются только вручную.</text><text x="500.0" y="942" text-anchor="middle" font-size="12" fill="#65758B" font-family="Arial, sans-serif">Сплошная стрелка — вызов; пунктирная — ответ. Время идёт сверху вниз.</text></svg>