<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680" role="img" aria-labelledby="as-is-overview-title as-is-overview-desc">
<title id="as-is-overview-title">AS-IS · Подготовка фото</title><desc id="as-is-overview-desc">Для каждого фото система выделяет ногти, вычисляет векторы трёх моделей и затем сохраняет полный результат.</desc>
<defs><marker id="as-is-overview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65758B"/></marker></defs>
<rect width="800" height="680" fill="#FFFFFF"/>
<text x="400.0" y="32" text-anchor="middle" font-size="22" fill="#243247" font-family="Arial, sans-serif">AS-IS · Подготовка фото</text><text x="400.0" y="60" text-anchor="middle" font-size="13" fill="#65758B" font-family="Arial, sans-serif">Существующий успешный путь; ошибки разобраны в документе</text><line x1="400" y1="144" x2="400" y2="172" stroke="#65758B" marker-end="url(#as-is-overview-arrow)"/><line x1="400" y1="236" x2="400" y2="264" stroke="#65758B" marker-end="url(#as-is-overview-arrow)"/><line x1="400" y1="328" x2="400" y2="356" stroke="#65758B" marker-end="url(#as-is-overview-arrow)"/><line x1="400" y1="420" x2="400" y2="448" stroke="#65758B" marker-end="url(#as-is-overview-arrow)"/><line x1="400" y1="512" x2="400" y2="540" stroke="#65758B" marker-end="url(#as-is-overview-arrow)"/><rect x="160" y="88" width="480" height="56" rx="6" fill="#FFFFFF" stroke="#C9D3DF"/><text x="400" y="112" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Выбранный список фото и профиль</text><rect x="160" y="180" width="480" height="56" rx="6" fill="#FFFFFF" stroke="#C9D3DF"/><text x="400" y="204" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Очередное PENDING фото</text><rect x="160" y="272" width="480" height="56" rx="6" fill="#FFFFFF" stroke="#C9D3DF"/><text x="400" y="296" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Локализатор I: найти ногти</text><text x="400" y="316" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Processor: подготовить crops</text><rect x="160" y="364" width="480" height="56" rx="6" fill="#FFFFFF" stroke="#C9D3DF"/><text x="400" y="388" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">OpenCLIP → DINOv2 → SigLIP2</text><text x="400" y="408" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Векторы всех областей этого фото</text><rect x="160" y="456" width="480" height="56" rx="6" fill="#EEF3FB" stroke="#2E5AA8"/><text x="400" y="480" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Сохранить маски / crops и все векторы</text><text x="400" y="500" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Записать полный исход фото</text><rect x="160" y="548" width="480" height="56" rx="6" fill="#FFFFFF" stroke="#C9D3DF"/><text x="400" y="572" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Повторить для остальных фото</text><text x="400" y="592" text-anchor="middle" font-size="15" fill="#243247" font-family="Arial, sans-serif">Вернуть сводку сборки</text><text x="400" y="660" text-anchor="middle" font-size="12" fill="#65758B" font-family="Arial, sans-serif">Готовые фото сохранены; промежуточных checkpoints encoder нет.</text></svg>